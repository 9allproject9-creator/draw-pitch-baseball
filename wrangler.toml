name = "draw-pitch-baseball"
main = "worker/index.js"
compatibility_date = "2026-11-01"

[assets]
directory = "./dist"
binding = "ASSETS"
run_worker_first = ["/api/*", "/ws/*", "/healthz"]

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# 무료 플랜은 SQLite 기반 Durable Object만 지원
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]

[observability]
enabled = true
